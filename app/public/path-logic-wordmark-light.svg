<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;display=swap');
      .brand-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        font-size: 28px;
        text-transform: uppercase;
        letter-spacing: -0.06em;
      }
      .brand-path {
        fill: #0F172A;
      }
      .brand-logic {
        fill: #8B5CF6;
      }
      .logo-bg {
        fill: #8B5CF6;
      }
      .logo-letter {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        font-size: 24px;
        fill: #FFFFFF;
      }
    </style>
  </defs>
  <!-- Logo Icon -->
  <rect x="10" y="10" width="40" height="40" rx="7" ry="7" class="logo-bg" />
  <text x="30" y="38" text-anchor="middle" class="logo-letter">P</text>
  
  <!-- Wordmark -->
  <text x="62" y="39" class="brand-text">
    <tspan class="brand-path">PATH</tspan><tspan class="brand-logic" dx="4">LOGIC</tspan>
  </text>
</svg>
