<shell>
    <div class="w-full max-w-2xl mx-auto space-y-6 pb-24">
        <!-- Top App Bar with Back Navigation -->
        <header class="flex items-center justify-between pb-4 border-b border-surface-200/60">
            <div class="flex items-center gap-3">
                <button
                    type="button"
                    (click)="handleCancel()"
                    aria-label="Back to Payees"
                    class="w-10 h-10 rounded-xl bg-surface-100 border border-surface-200 flex items-center justify-center text-surface-800 hover:bg-surface-200 transition-colors cursor-pointer"
                >
                    <i class="pi pi-arrow-left text-sm font-bold"></i>
                </button>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-surface-900">
                        {{ isEditMode() ? 'Edit Payee' : 'New Payee' }}
                    </h1>
                    <p class="text-xs text-surface-500 font-medium mt-0.5">
                        {{
                            isEditMode()
                                ? 'Update payee details and categorization rules'
                                : 'Add a new spender or recipient to your directory'
                        }}
                    </p>
                </div>
            </div>
        </header>

        <!-- Error Alert -->
        @if (errorMessage()) {
            <div
                class="p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 text-sm flex items-center gap-3 animate-fade-in"
            >
                <i class="pi pi-exclamation-circle text-lg shrink-0"></i>
                <p class="font-medium">{{ errorMessage() }}</p>
            </div>
        }

        <!-- Streamlined Form Body -->
        <form (ngSubmit)="handleSave()" class="space-y-6">
            <div
                class="p-6 bg-surface-0 border border-surface-200/60 rounded-2xl shadow-premium space-y-5"
            >
                <!-- Payee Name Input -->
                <div class="space-y-2">
                    <label
                        for="payee-name-input"
                        class="block text-xs font-bold uppercase tracking-wider text-surface-700"
                    >
                        Payee Name <span class="text-red-500">*</span>
                    </label>
                    <input
                        id="payee-name-input"
                        type="text"
                        [ngModel]="name()"
                        (ngModelChange)="name.set($event)"
                        name="name"
                        placeholder="e.g. Whole Foods Market, Netflix, Landlord"
                        required
                        autofocus
                        class="block w-full px-4 py-3 bg-surface-0 border border-surface-200 rounded-xl text-base font-semibold text-surface-900 placeholder:text-surface-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-xs min-h-[48px]"
                    />
                </div>

                <!-- Default Category Input / Selector -->
                <div class="space-y-2">
                    <label
                        for="payee-category-select"
                        class="block text-xs font-bold uppercase tracking-wider text-surface-700"
                    >
                        Default Category
                    </label>
                    <select
                        id="payee-category-select"
                        [ngModel]="defaultCategoryId()"
                        (ngModelChange)="defaultCategoryId.set($event)"
                        name="defaultCategoryId"
                        class="block w-full px-4 py-3 bg-surface-0 border border-surface-200 rounded-xl text-sm font-medium text-surface-900 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-xs min-h-[48px]"
                    >
                        <option value="">-- No Default Category --</option>
                        @for (cat of categories(); track cat.id) {
                            <option [value]="cat.id">{{ cat.name }}</option>
                        }
                    </select>
                    <p class="text-[11px] text-surface-400 font-medium">
                        Transactions from this payee will be automatically assigned to this
                        category.
                    </p>
                </div>

                <!-- Auto-Categorization Rules & Notes -->
                <div class="space-y-2">
                    <label
                        for="payee-notes-input"
                        class="block text-xs font-bold uppercase tracking-wider text-surface-700"
                    >
                        Notes &amp; Matching Rules
                    </label>
                    <textarea
                        id="payee-notes-input"
                        [ngModel]="notes()"
                        (ngModelChange)="notes.set($event)"
                        name="notes"
                        rows="3"
                        placeholder="e.g. Match on 'WFM', 'WHOLEFDS', or account memo notes..."
                        class="block w-full px-4 py-3 bg-surface-0 border border-surface-200 rounded-xl text-sm font-medium text-surface-900 placeholder:text-surface-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-xs"
                    ></textarea>
                </div>
            </div>

            <!-- Sticky Bottom Action Bar (Fixed on mobile, clean block on desktop) -->
            <div
                class="fixed sm:static bottom-0 left-0 right-0 p-4 sm:p-0 bg-surface-0/95 sm:bg-transparent backdrop-blur-md sm:backdrop-blur-none border-t border-surface-200 sm:border-t-0 z-40 flex items-center justify-end gap-3"
            >
                <button
                    type="button"
                    (click)="handleCancel()"
                    class="flex-1 sm:flex-none min-h-[48px] px-5 border border-surface-200 hover:bg-surface-100 text-surface-700 rounded-xl text-sm font-semibold transition-colors cursor-pointer"
                >
                    Cancel
                </button>
                <button
                    type="submit"
                    [disabled]="isSubmitting() || !name().trim()"
                    class="flex-1 sm:flex-none min-h-[48px] px-6 bg-primary text-white hover:bg-primary/90 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl text-sm font-bold shadow-premium transition-all cursor-pointer flex items-center justify-center gap-2"
                >
                    @if (isSubmitting()) {
                        <i class="pi pi-spin pi-spinner text-sm"></i>
                        Saving...
                    } @else {
                        <i class="pi pi-check text-sm font-bold"></i>
                        {{ isEditMode() ? 'Save Changes' : 'Create Payee' }}
                    }
                </button>
            </div>
        </form>
    </div>
</shell>
