<shell>
    @if (account(); as acc) {
        <div class="max-w-4xl mx-auto space-y-6">
            <div class="flex items-center gap-4">
                <button
                    (click)="handleCancel()"
                    class="p-0 h-8 w-8 flex items-center justify-center hover:bg-surface-100 rounded-full text-surface-500 hover:text-surface-800 transition-all"
                >
                    <i class="pi pi-chevron-left text-xl"></i>
                </button>
                <div>
                    <div class="flex items-center gap-2 mb-0.5">
                        <i class="pi pi-info-circle text-sm text-primary"></i>
                        <h1 class="text-lg font-black uppercase tracking-tight text-surface-800">
                            Account <span class="text-primary">Details</span>
                        </h1>
                    </div>
                    <p
                        class="text-[10px] text-surface-500 font-bold uppercase tracking-widest opacity-60"
                    >
                        Configure metadata and historical balance adjustments for {{ acc.name }}
                    </p>
                </div>
            </div>

            <div
                class="bg-surface-0 border border-surface-200 rounded-sm overflow-hidden shadow-xl"
            >
                <div class="p-8">
                    <account-edit-form
                        [accountData]="acc"
                        (cancelled)="handleCancel()"
                        (submitted)="handleSubmit($event)"
                    />
                </div>
            </div>
        </div>
    } @else {
        <div class="h-full flex items-center justify-center">
            <div
                class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin"
            ></div>
        </div>
    }
</shell>
