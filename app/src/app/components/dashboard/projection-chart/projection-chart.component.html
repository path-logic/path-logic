<div [class]="'relative group ' + className()">
    @if (data().length === 0) {
        <div
            class="flex items-center justify-center bg-surface-100/10 rounded-sm border border-dashed border-surface-200"
            [style.height.px]="height()"
        >
            <p class="text-[10px] font-bold uppercase text-surface-800 dark:text-surface-300">
                No projection data available
            </p>
        </div>
    } @else {
        <div class="flex justify-between items-end mb-4 px-1">
            <div>
                <h3
                    class="text-[10px] font-bold text-surface-800 dark:text-surface-300 uppercase tracking-widest mb-1"
                >
                    90-Day Forecast
                </h3>
                <div class="flex items-baseline gap-2">
                    <span class="text-2xl font-mono font-black tracking-tighter">
                        {{ formattedFinalBalance() }}
                    </span>
                    <span
                        class="text-[10px] font-bold px-1.5 py-0.5 rounded-sm uppercase tracking-tighter"
                        [class]="{
                            'bg-emerald-500/10 text-emerald-700 dark:text-emerald-400': isUp(),
                            'bg-red-500/10 text-red-500': !isUp()
                        }"
                    >
                        {{ isUp() ? '↑' : '↓' }}
                        {{ formattedDelta() }}
                    </span>
                </div>
            </div>
            <div class="text-right">
                <p
                    class="text-[8px] font-bold text-surface-800 dark:text-surface-300 uppercase tracking-tighter"
                >
                    Projected Change
                </p>
                <p
                    class="text-[10px] font-mono font-bold text-surface-800/90 dark:text-surface-300 italic"
                >
                    By {{ formattedEndDate() }}
                </p>
            </div>
        </div>

        <div class="relative overflow-visible" [style.height.px]="height()">
            <p-chart
                type="line"
                [data]="chartData()"
                [options]="chartOptions()"
                [height]="height() + 'px'"
                ariaLabel="Cashflow projection chart"
                [ariaLabel]="'Cashflow projection chart'"
            ></p-chart>

            <!-- Axes Labels -->
            <div
                class="absolute top-0 left-0 w-full h-full pointer-events-none font-bold uppercase"
            >
                <div
                    class="absolute top-0 left-0 text-[8px] text-surface-800 dark:text-surface-300 tracking-tighter"
                >
                    Forecast
                </div>
                <div
                    class="absolute bottom-0 left-0 text-[8px] text-surface-800 dark:text-surface-300 tracking-tighter"
                >
                    Current
                </div>
            </div>
        </div>

        <!-- Timeline ticks -->
        <div class="flex justify-between mt-2 px-1">
            <span class="text-[8px] font-bold text-surface-800/80 dark:text-surface-300 uppercase">
                Today
            </span>
            <span class="text-[8px] font-bold text-surface-800/80 dark:text-surface-300 uppercase"
                >30d</span
            >
            <span class="text-[8px] font-bold text-surface-800/80 dark:text-surface-300 uppercase"
                >60d</span
            >
            <span class="text-[8px] font-bold text-surface-800/80 dark:text-surface-300 uppercase"
                >90d</span
            >
        </div>
    }
</div>
