<div [class]="'relative group ' + className()">
    @if (data().length === 0) {
        <div
            class="flex items-center justify-center bg-surface-100/10 rounded-sm border border-dashed border-surface-200"
            [style.height.px]="height()"
        >
            <p class="text-[10px] font-bold uppercase text-surface-800 dark:text-surface-300">
                No projection data available
            </p>
        </div>
    } @else {
        <div class="flex justify-between items-end mb-3 px-1">
            <div>
                <h3 class="text-xs font-bold text-surface-500 uppercase tracking-wider mb-1">
                    90-Day Cashflow Forecast
                </h3>
                <div class="flex items-baseline gap-2">
                    <span class="text-2xl font-mono font-black tracking-tight text-surface-900">
                        {{ formattedFinalBalance() }}
                    </span>
                    <span
                        class="text-xs font-bold px-2 py-0.5 rounded-full"
                        [class]="{
                            'bg-emerald-500/10 text-emerald-700 dark:text-emerald-400': isUp(),
                            'bg-red-500/10 text-red-500': !isUp()
                        }"
                    >
                        {{ isUp() ? '↑ +' : '↓ ' }}{{ formattedDelta() }}
                    </span>
                </div>
            </div>
            <div class="text-right">
                <p class="text-xs text-surface-500 font-medium">Projected by</p>
                <p class="text-xs font-semibold text-surface-700">
                    {{ formattedEndDate() }}
                </p>
            </div>
        </div>

        <div class="relative overflow-visible" [style.height.px]="height()">
            <p-chart
                type="line"
                [data]="chartData()"
                [options]="chartOptions()"
                [height]="height() + 'px'"
                ariaLabel="Cashflow projection chart"
                [ariaLabel]="'Cashflow projection chart'"
            ></p-chart>
        </div>

        <!-- Timeline ticks -->
        <div class="flex justify-between mt-2 px-1 text-xs text-surface-500 font-medium">
            <span>Today</span>
            <span>+30d</span>
            <span>+60d</span>
            <span>+90d</span>
        </div>
    }
</div>
