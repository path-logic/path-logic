@if (visible()) {
    <div
        class="quick-entry-overlay fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6 bg-surface-950/60 dark:bg-surface-950/80 backdrop-blur-sm"
        (click)="onBackdropClick($event)"
        (keydown)="onKeyDown($event)"
        tabindex="-1"
    >
        <div
            class="quick-entry-modal w-full sm:max-w-lg bg-surface-0 dark:bg-surface-900 border-t sm:border border-surface-200/90 dark:border-surface-800 rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-y-auto max-h-[92dvh] sm:max-h-none p-5 sm:p-8 space-y-4 sm:space-y-5 relative"
            role="dialog"
            aria-modal="true"
            aria-labelledby="quick-entry-title"
        >
            <!-- Mobile Pull / Grab Handle -->
            <div class="sm:hidden flex justify-center w-full -mt-1 mb-1" aria-hidden="true">
                <div class="w-12 h-1.5 rounded-full bg-surface-300 dark:bg-surface-700"></div>
            </div>

            <!-- Header Row -->
            <div
                class="flex items-center justify-between gap-3 pb-3 sm:pb-4 border-b border-surface-100 dark:border-surface-800"
            >
                <div class="flex items-center gap-3">
                    <div
                        class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-700 dark:text-emerald-400 flex items-center justify-center ring-1 ring-emerald-500/20"
                    >
                        <i class="pi pi-bolt text-sm sm:text-base"></i>
                    </div>
                    <div>
                        <h2
                            id="quick-entry-title"
                            class="text-base sm:text-lg font-bold text-surface-900 dark:text-surface-100 leading-tight"
                        >
                            Quick Entry
                        </h2>
                        <p class="text-xs text-surface-500 font-medium">
                            @if (selectedAccount()) {
                                Posting to
                                <span
                                    class="font-semibold text-surface-700 dark:text-surface-300"
                                    >{{ selectedAccount()?.name }}</span
                                >
                            } @else {
                                Instant ledger capture &bull; Today
                            }
                        </p>
                    </div>
                </div>

                <!-- Close Dialog Button -->
                <button
                    type="button"
                    (click)="close()"
                    aria-label="Close Quick Entry"
                    class="w-10 h-10 sm:w-8 sm:h-8 rounded-full flex items-center justify-center text-surface-500 hover:text-surface-900 dark:hover:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors cursor-pointer shrink-0"
                >
                    <i class="pi pi-times text-sm"></i>
                </button>
            </div>

            <!-- Expense / Income Segmented Control -->
            <div
                role="group"
                aria-label="Transaction Type"
                class="grid grid-cols-2 p-1 rounded-2xl bg-surface-100 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 gap-1"
            >
                <button
                    type="button"
                    (click)="isExpense.set(true)"
                    [attr.aria-pressed]="isExpense()"
                    class="py-2.5 sm:py-2 px-4 min-h-[44px] sm:min-h-[38px] rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 cursor-pointer"
                    [class.bg-surface-0]="isExpense()"
                    [class.dark:bg-surface-900]="isExpense()"
                    [class.text-red-600]="isExpense()"
                    [class.dark:text-red-400]="isExpense()"
                    [class.shadow-xs]="isExpense()"
                    [class.text-surface-600]="!isExpense()"
                    [class.dark:text-surface-400]="!isExpense()"
                >
                    <i class="pi pi-arrow-down-left text-xs"></i>
                    Expense
                </button>
                <button
                    type="button"
                    (click)="isExpense.set(false)"
                    [attr.aria-pressed]="!isExpense()"
                    class="py-2.5 sm:py-2 px-4 min-h-[44px] sm:min-h-[38px] rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 cursor-pointer"
                    [class.bg-surface-0]="!isExpense()"
                    [class.dark:bg-surface-900]="!isExpense()"
                    [class.text-emerald-700]="!isExpense()"
                    [class.dark:text-emerald-400]="!isExpense()"
                    [class.shadow-xs]="!isExpense()"
                    [class.text-surface-600]="isExpense()"
                    [class.dark:text-surface-400]="isExpense()"
                >
                    <i class="pi pi-arrow-up-right text-xs"></i>
                    Income
                </button>
            </div>

            <!-- Feedback Alerts with Live Regions for A11y -->
            <div aria-live="polite" aria-atomic="true">
                @if (showSuccess()) {
                    <div
                        class="p-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-700 dark:text-emerald-400 text-xs font-bold flex items-center gap-2 animate-bounce-subtle"
                    >
                        <i class="pi pi-check-circle text-base"></i>
                        <span>Transaction captured successfully! Closing...</span>
                    </div>
                }

                @if (errorMessage()) {
                    <div
                        id="quick-entry-error"
                        class="p-3 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-600 dark:text-red-400 text-xs font-bold flex items-center gap-2"
                    >
                        <i class="pi pi-exclamation-triangle text-base"></i>
                        <span>{{ errorMessage() }}</span>
                    </div>
                }
            </div>

            <!-- Form Fields -->
            <div class="space-y-3.5 sm:space-y-4">
                <!-- Account Dropdown -->
                <div class="space-y-1 sm:space-y-1.5">
                    <label
                        for="quick-entry-account"
                        class="text-xs font-bold uppercase tracking-wider text-surface-600 dark:text-surface-400"
                    >
                        Account <span class="text-red-600 dark:text-red-400">*</span>
                    </label>
                    <select
                        id="quick-entry-account"
                        [ngModel]="selectedAccountId()"
                        (ngModelChange)="selectedAccountId.set($event)"
                        aria-required="true"
                        class="w-full px-4 py-2.5 bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-xl text-xs font-semibold text-surface-900 dark:text-surface-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all cursor-pointer min-h-[42px]"
                    >
                        @for (acc of accounts(); track acc.id) {
                            <option [value]="acc.id">
                                {{ acc.name }} ({{ acc.institutionName }})
                            </option>
                        }
                    </select>
                </div>

                <!-- Payee Input with Datalist -->
                <div class="space-y-1 sm:space-y-1.5">
                    <label
                        for="quick-entry-payee"
                        class="text-xs font-bold uppercase tracking-wider text-surface-600 dark:text-surface-400"
                    >
                        Payee <span class="text-red-600 dark:text-red-400">*</span>
                    </label>
                    <input
                        id="quick-entry-payee"
                        type="text"
                        list="quick-entry-payees-list"
                        [ngModel]="payee()"
                        (ngModelChange)="payee.set($event)"
                        (keyup.enter)="saveTransaction()"
                        aria-required="true"
                        placeholder="e.g. Netflix, Trader Joe's"
                        class="w-full px-4 py-2.5 bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-xl text-xs font-semibold text-surface-900 dark:text-surface-100 placeholder:text-surface-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all min-h-[42px]"
                    />
                    <datalist id="quick-entry-payees-list">
                        @for (p of payees(); track p.id) {
                            <option [value]="p.name"></option>
                        }
                    </datalist>
                </div>

                <!-- Category and Amount Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                    <!-- Category Input -->
                    <div class="space-y-1 sm:space-y-1.5">
                        <label
                            for="quick-entry-category"
                            class="text-xs font-bold uppercase tracking-wider text-surface-600 dark:text-surface-400"
                        >
                            Category / Memo
                        </label>
                        <input
                            id="quick-entry-category"
                            type="text"
                            [ngModel]="category()"
                            (ngModelChange)="category.set($event)"
                            (keyup.enter)="saveTransaction()"
                            placeholder="e.g. Groceries"
                            class="w-full px-4 py-2.5 bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-xl text-xs font-semibold text-surface-900 dark:text-surface-100 placeholder:text-surface-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all min-h-[42px]"
                        />
                    </div>

                    <!-- Amount Input -->
                    <div class="space-y-1 sm:space-y-1.5">
                        <label
                            for="quick-entry-amount"
                            class="text-xs font-bold uppercase tracking-wider text-surface-600 dark:text-surface-400"
                        >
                            Amount ($) <span class="text-red-600 dark:text-red-400">*</span>
                        </label>
                        <div class="relative">
                            <span
                                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none font-mono font-bold text-surface-400 text-xs"
                            >
                                $
                            </span>
                            <input
                                id="quick-entry-amount"
                                type="text"
                                [ngModel]="amountString()"
                                (ngModelChange)="amountString.set($event)"
                                (keyup.enter)="saveTransaction()"
                                aria-required="true"
                                placeholder="0.00"
                                class="w-full pl-8 pr-4 py-2.5 bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-xl text-xs font-bold font-mono text-surface-900 dark:text-surface-100 placeholder:text-surface-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all min-h-[42px]"
                            />
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Actions -->
            <div
                class="flex items-center justify-end gap-3 pt-3 sm:pt-4 border-t border-surface-100 dark:border-surface-800 pb-2 sm:pb-0"
            >
                <button
                    type="button"
                    (click)="close()"
                    class="min-h-[42px] px-5 rounded-xl border border-surface-200 dark:border-surface-700 text-surface-700 dark:text-surface-300 hover:bg-surface-100 dark:hover:bg-surface-800 text-xs font-bold transition-all cursor-pointer"
                >
                    Cancel
                </button>
                <button
                    type="button"
                    (click)="saveTransaction()"
                    [disabled]="isSubmitting()"
                    class="min-h-[42px] px-6 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold shadow-md hover:shadow-lg transition-all flex items-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    @if (isSubmitting()) {
                        <i class="pi pi-spinner pi-spin text-xs"></i>
                        <span>Saving...</span>
                    } @else {
                        <i class="pi pi-check text-xs"></i>
                        <span>Save Transaction</span>
                    }
                </button>
            </div>
        </div>
    </div>
}
