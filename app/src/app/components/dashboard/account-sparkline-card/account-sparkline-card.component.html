<a
    [routerLink]="['/accounts', account().id]"
    class="account-sparkline-card group block p-5 rounded-2xl bg-surface-0 border border-surface-200/80 hover:border-primary/50 transition-all shadow-sm hover:shadow-md cursor-pointer relative overflow-hidden"
>
    <div class="flex items-start justify-between gap-2 mb-3">
        <div class="flex items-center gap-2.5">
            <div
                class="w-8 h-8 rounded-xl bg-primary/10 text-primary flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform"
            >
                <i [class]="'pi ' + accountIcon() + ' text-sm'"></i>
            </div>
            <div>
                <h3
                    class="text-sm font-bold text-surface-900 group-hover:text-primary transition-colors truncate max-w-[140px]"
                >
                    {{ account().name }}
                </h3>
                <p class="text-[11px] font-medium text-surface-500 truncate max-w-[140px]">
                    {{ account().institutionName || typeDisplayName() }}
                </p>
            </div>
        </div>

        @if (trendPercent()) {
            <span
                class="px-2 py-0.5 rounded-full text-[10px] font-bold border"
                [class.bg-emerald-500-10]="!trendPercent()?.startsWith('-')"
                [class.text-emerald-700]="!trendPercent()?.startsWith('-')"
                [class.dark:text-emerald-400]="!trendPercent()?.startsWith('-')"
                [class.border-emerald-500-20]="!trendPercent()?.startsWith('-')"
                [class.bg-red-500-10]="trendPercent()?.startsWith('-')"
                [class.text-red-600]="trendPercent()?.startsWith('-')"
                [class.border-red-500-20]="trendPercent()?.startsWith('-')"
            >
                {{ trendPercent() }}
            </span>
        }
    </div>

    <!-- Balance & Sparkline Row -->
    <div class="flex items-end justify-between gap-4 mt-2">
        <div>
            <span class="text-[10px] font-bold uppercase tracking-wider text-surface-500 block">
                {{ isCredit() ? 'Balance Due' : 'Current Balance' }}
            </span>
            <span
                class="text-2xl font-black tracking-tight font-mono text-surface-900"
                [class.text-red-500]="isNegative()"
            >
                {{ formattedBalance() }}
            </span>
        </div>

        <!-- SVG Mini Sparkline Curve -->
        <div class="w-24 h-10 shrink-0 opacity-80 group-hover:opacity-100 transition-opacity">
            <svg viewBox="0 0 100 45" fill="none" class="w-full h-full overflow-visible">
                <path
                    [attr.d]="sparklinePath()"
                    [attr.stroke]="sparklineStrokeColor()"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </div>
    </div>
</a>
