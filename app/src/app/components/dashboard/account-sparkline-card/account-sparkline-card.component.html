<article
    class="account-sparkline-card group p-6 rounded-2xl bg-surface-0 dark:bg-surface-900 border border-surface-200/80 dark:border-surface-800 hover:border-emerald-500/50 dark:hover:border-emerald-500/40 transition-all duration-300 shadow-sm hover:shadow-lg relative overflow-hidden flex flex-col justify-between min-h-[175px] cursor-pointer"
>
    <!-- Full-Card Click Target Overlay Anchor -->
    <a
        [routerLink]="['/accounts', account().id]"
        class="absolute inset-0 z-0 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded-2xl"
        [attr.aria-label]="'View ledger for ' + account().name"
    ></a>

    <!-- Top Row: Icon + Title & Type + Trend Badge -->
    <div class="flex items-start justify-between gap-3 mb-3 relative z-10 pointer-events-none">
        <div class="flex items-center gap-3 min-w-0 pointer-events-auto">
            <div
                class="w-10 h-10 rounded-2xl bg-primary/10 dark:bg-primary/20 text-primary flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform duration-300 shadow-xs"
            >
                <i [class]="'pi ' + accountIcon() + ' text-base'"></i>
            </div>
            <div class="min-w-0">
                <span
                    class="text-base font-bold text-surface-900 dark:text-surface-100 group-hover:text-primary dark:group-hover:text-emerald-400 transition-colors truncate block"
                >
                    {{ account().name }}
                </span>
                <p class="text-xs font-medium text-surface-500 truncate">
                    {{ account().institutionName || typeDisplayName() }}
                </p>
            </div>
        </div>

        @if (trendPercent()) {
            <span
                class="px-2.5 py-1 rounded-full text-xs font-bold border shrink-0 relative z-10"
                [class.bg-emerald-500-10]="!trendPercent()?.startsWith('-')"
                [class.text-emerald-700]="!trendPercent()?.startsWith('-')"
                [class.dark:text-emerald-400]="!trendPercent()?.startsWith('-')"
                [class.border-emerald-500-20]="!trendPercent()?.startsWith('-')"
                [class.bg-red-500-10]="trendPercent()?.startsWith('-')"
                [class.text-red-600]="trendPercent()?.startsWith('-')"
                [class.border-red-500-20]="trendPercent()?.startsWith('-')"
            >
                {{ trendPercent() }}
            </span>
        }
    </div>

    <!-- Balance & Sparkline Row -->
    <div class="flex items-end justify-between gap-4 my-2 relative z-10 pointer-events-none">
        <div>
            <span
                class="text-[10px] font-bold uppercase tracking-wider text-surface-500 block mb-0.5"
            >
                {{ isCredit() ? 'Balance Due' : 'Current Balance' }}
            </span>
            <span
                class="text-3xl font-black tracking-tight font-mono text-surface-900 dark:text-surface-100"
                [class.text-red-600]="isNegative()"
                [class.dark:text-red-400]="isNegative()"
            >
                {{ formattedBalance() }}
            </span>
        </div>

        <!-- SVG Mini Sparkline Curve -->
        <div class="w-28 h-12 shrink-0 opacity-85 group-hover:opacity-100 transition-opacity">
            <svg viewBox="0 0 100 45" fill="none" class="w-full h-full overflow-visible">
                <defs>
                    <linearGradient
                        [id]="'sparkline-grad-' + account().id"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                    >
                        <stop
                            offset="0%"
                            [attr.stop-color]="sparklineStrokeColor()"
                            stop-opacity="0.25"
                        />
                        <stop
                            offset="100%"
                            [attr.stop-color]="sparklineStrokeColor()"
                            stop-opacity="0.0"
                        />
                    </linearGradient>
                </defs>
                <path
                    [attr.d]="sparklinePath()"
                    [attr.stroke]="sparklineStrokeColor()"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </div>
    </div>

    <!-- Bottom Action Row: Direct Quick Entry Popup Trigger & Ledger Link -->
    <div
        class="flex items-center justify-between pt-3 mt-1 border-t border-surface-100 dark:border-surface-800/80 gap-2 relative z-10"
    >
        <button
            type="button"
            (click)="$event.stopPropagation(); quickEntryRequested.emit(account().id)"
            [attr.aria-label]="'Quick Entry for ' + account().name"
            class="min-h-[44px] sm:min-h-[36px] px-4 py-2 sm:py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 dark:bg-emerald-500/15 dark:hover:bg-emerald-500/25 text-emerald-700 dark:text-emerald-400 font-bold text-xs flex items-center gap-1.5 transition-all cursor-pointer group/btn"
        >
            <i class="pi pi-bolt text-xs group-hover/btn:scale-110 transition-transform"></i>
            <span>+ Quick Entry</span>
        </button>

        <span
            class="min-h-[44px] sm:min-h-[36px] px-3.5 py-2 sm:py-1.5 rounded-xl text-surface-600 dark:text-surface-400 group-hover:text-surface-900 dark:group-hover:text-surface-100 text-xs font-semibold flex items-center gap-1 transition-colors pointer-events-none"
        >
            <span>Ledger</span>
            <i
                class="pi pi-arrow-right text-[10px] group-hover:translate-x-0.5 transition-transform"
            ></i>
        </span>
    </div>
</article>
