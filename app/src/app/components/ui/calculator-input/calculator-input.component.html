<p-inputGroup [styleClass]="styleClass">
    @if (prefix) {
        <p-inputGroupAddon
            styleClass="!bg-transparent !border-none !text-surface-500 font-bold px-3"
        >
            {{ prefix }}
        </p-inputGroupAddon>
    }
    <input
        [id]="inputId"
        pInputText
        type="text"
        [placeholder]="placeholder"
        [disabled]="disabled"
        [readonly]="readonly"
        [ngModel]="displayValue()"
        (ngModelChange)="displayValue.set($event)"
        (focus)="handleFocus()"
        (blur)="handleBlur()"
        (keydown)="handleKeydown($event)"
        (mouseenter)="checkOverflow($event)"
        [pTooltip]="overflowTitle"
        tooltipPosition="top"
        tooltipStyleClass="text-lg font-bold bg-surface-900 text-white shadow-xl px-3 py-2 rounded-md"
        [tooltipDisabled]="!overflowTitle"
        [ngClass]="['w-full text-right font-mono !bg-transparent !border-none', inputClass]"
    />
    <p-inputGroupAddon
        (click)="op.toggle($event)"
        styleClass="!bg-transparent !border-none cursor-pointer hover:!bg-surface-100/50 px-3"
    >
        <i class="pi pi-calculator text-surface-500"></i>
    </p-inputGroupAddon>
</p-inputGroup>

<p-popover #op>
    <div class="flex flex-col w-[250px] min-h-[150px] font-mono text-sm">
        <div class="flex-grow p-2 overflow-y-auto border-b border-surface-200">
            @if (history().length === 0) {
                <div class="text-surface-400 italic text-center mt-8">No history</div>
            }
            @for (item of history(); track $index) {
                <div class="text-right py-1 text-surface-600">
                    {{ item }}
                </div>
            }
        </div>
        <div class="p-2 bg-surface-50 flex justify-between items-center">
            <span class="text-xs text-surface-500">Math inline (e.g., 2000 * .85)</span>
            <p-button
                icon="pi pi-check"
                size="small"
                [text]="true"
                (onClick)="op.hide()"
            ></p-button>
        </div>
    </div>
</p-popover>
