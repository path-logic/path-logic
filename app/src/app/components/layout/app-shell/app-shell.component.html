<div
    class="h-screen bg-background text-foreground font-sans selection:bg-primary/30 overflow-hidden flex flex-col relative"
>
    <!-- Security & Auth Guardrails -->
    <app-security-overlay [isVisible]="isIdle()" (onUnlock)="resetTimers()" />
    <app-auth-overlay />
    <app-sync-pending-banner />

    <app-header />

    <main
        class="flex-1 w-full flex flex-col min-h-0 relative"
        [class.overflow-hidden]="!scrollable()"
    >
        <div
            class="flex-none w-full border-b border-border/50 bg-background/50 backdrop-blur-sm px-4"
        >
            <div class="max-w-7xl mx-auto py-2">
                <app-breadcrumb-nav />
            </div>
        </div>

        <div
            class="flex-1 w-full flex flex-col"
            [class.overflow-y-auto]="scrollable()"
            [class.overflow-x-hidden]="scrollable()"
            [class.overflow-hidden]="!scrollable()"
        >
            <div
                class="w-full mx-auto flex flex-col"
                [class.p-4]="!noPadding()"
                [class.max-w-7xl]="!noPadding()"
                [class.min-h-full]="scrollable()"
                [class.h-full]="!scrollable()"
            >
                <ng-content />
            </div>
        </div>
    </main>

    <app-footer />
</div>
