<div
    class="h-screen bg-surface-50 text-surface-900 font-sans selection:bg-primary/30 overflow-hidden flex flex-col relative"
>
    <!-- Security & Auth Guardrails -->
    <security-overlay [isVisible]="isIdle()" (unlocked)="resetTimers()" />
    <auth-overlay />
    <sync-pending-banner />
    <model-upgrade-banner />
    <!-- Background Drive sync notifications -->
    <merge-sync-toast />
    <conflict-resolution-modal />

    <header class="app-header"></header>

    <main
        class="flex-1 w-full flex flex-col min-h-0 relative"
        [class.overflow-hidden]="!scrollable()"
    >
        <breadcrumb-nav />

        <div
            class="flex-1 w-full flex flex-col"
            [class.overflow-y-auto]="scrollable()"
            [class.overflow-x-hidden]="scrollable()"
            [class.overflow-hidden]="!scrollable()"
        >
            <div
                class="w-full mx-auto flex flex-col"
                [class.p-4]="!noPadding()"
                [class.max-w-7xl]="!noPadding()"
                [class.min-h-full]="scrollable()"
                [class.h-full]="!scrollable()"
            >
                <ng-content />
            </div>
        </div>
    </main>

    <footer></footer>

    <!-- AI Assistant Sidebar -->
    <ai-assistant-sidebar />
</div>
