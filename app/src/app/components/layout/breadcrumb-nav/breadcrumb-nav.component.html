@if (breadcrumbs().length > 0) {
    <div
        class="flex-none w-full border-b border-surface-200/50 px-4 backdrop-blur-sm"
        style="background-color: color-mix(in srgb, var(--p-surface-0) 60%, transparent)"
    >
        <div class="max-w-7xl mx-auto py-2">
            <p-breadcrumb
                [model]="breadcrumbs()"
                [home]="home()"
                styleClass="!bg-transparent !border-0 !p-0 text-[10px] uppercase font-bold tracking-wider"
            ></p-breadcrumb>
        </div>
    </div>
}
