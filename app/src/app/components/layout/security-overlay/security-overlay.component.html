<div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-surface-50/40 backdrop-blur-xl transition-all duration-500 ease-in-out opacity-0 pointer-events-none"
    [class.opacity-100]="isVisible()"
    [class.pointer-events-auto]="isVisible()"
>
    <div
        class="max-w-md w-full mx-4 p-8 rounded-3xl border border-surface-200 bg-surface-0/80 shadow-2xl backdrop-blur-md text-center transform transition-all duration-500 delay-75 ease-out scale-95 translate-y-4 opacity-0"
        [class.scale-100]="isVisible()"
        [class.translate-y-0]="isVisible()"
        [class.opacity-100]="isVisible()"
    >
        <div
            class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-6 ring-1 ring-primary/20"
        >
            <i class="pi pi-lock text-3xl text-primary shadow-sm"></i>
        </div>

        <h2 class="text-2xl font-bold tracking-tight mb-2">Session Paused</h2>
        <p class="text-surface-500 text-sm mb-8 px-4 leading-relaxed">
            Your session has been paused due to inactivity to protect your financial data.
        </p>

        <div class="space-y-3">
            <button
                (click)="unlocked.emit()"
                class="w-full h-12 rounded-xl text-md font-semibold group flex items-center justify-center gap-2 transition-transform active:scale-[0.98] bg-primary text-white hover:bg-primary/90"
            >
                Resume Session
                <i
                    class="pi pi-arrow-right text-base transition-transform group-hover:translate-x-1"
                ></i>
            </button>

            <div
                class="pt-2 flex items-center justify-center gap-2 text-[10px] text-surface-500 uppercase tracking-widest font-medium"
            >
                <i class="pi pi-shield text-xs"></i>
                Secure Local-First Environment
            </div>
        </div>
    </div>
</div>
