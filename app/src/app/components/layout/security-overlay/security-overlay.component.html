<div
    class="fixed inset-0 z-[1200] flex items-center justify-center bg-surface-0 sm:bg-surface-50/40 sm:backdrop-blur-xl transition-all duration-500 ease-in-out opacity-0 pointer-events-none"
    role="region"
    aria-label="Session Paused Lock Screen"
    [class.opacity-100]="isVisible()"
    [class.pointer-events-auto]="isVisible()"
>
    <div
        class="w-full h-full sm:h-auto sm:max-w-md sm:mx-4 p-6 sm:p-12 rounded-none sm:rounded-3xl border-0 sm:border border-surface-200 bg-surface-0 sm:bg-surface-0/95 shadow-none sm:shadow-2xl sm:backdrop-blur-md text-center transform transition-all duration-500 delay-75 ease-out scale-100 sm:scale-95 sm:translate-y-4 opacity-0 flex flex-col justify-between sm:justify-center min-h-screen sm:min-h-[400px] overflow-y-auto"
        [class.sm:scale-100]="isVisible()"
        [class.sm:translate-y-0]="isVisible()"
        [class.opacity-100]="isVisible()"
    >
        <!-- Main Body -->
        <div class="my-auto py-6 sm:py-0">
            <!-- Pulsing Circular Lock Badge -->
            <div
                class="w-16 h-16 shrink-0 aspect-square bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6 ring-1 ring-primary/20 animate-pulse"
            >
                <i class="pi pi-lock text-2xl sm:text-3xl text-primary shadow-xs"></i>
            </div>

            <h2 class="text-2xl sm:text-2xl font-black tracking-tight mb-3 text-surface-900">
                Session Paused
            </h2>
            <p
                class="text-surface-600 text-sm sm:text-sm mb-6 sm:mb-8 px-2 sm:px-4 leading-relaxed max-w-sm mx-auto"
            >
                Your session has been paused due to inactivity to protect your local financial data.
            </p>
        </div>

        <!-- Bottom Actions -->
        <div class="space-y-4 pb-6 sm:pb-0 w-full max-w-sm mx-auto">
            <button
                (click)="unlocked.emit()"
                aria-label="Resume Session"
                class="w-full min-h-[56px] sm:min-h-[48px] py-4 sm:py-3 px-6 rounded-2xl sm:rounded-xl text-base sm:text-md font-bold group flex items-center justify-center gap-2 transition-transform active:scale-[0.98] bg-primary text-white hover:bg-primary/90 shadow-premium cursor-pointer"
            >
                <span>Resume Session</span>
                <i
                    class="pi pi-arrow-right text-base transition-transform group-hover:translate-x-1"
                    aria-hidden="true"
                ></i>
            </button>

            <div
                class="pt-1 flex items-center justify-center gap-2 text-xs sm:text-[10px] text-surface-500 uppercase tracking-widest font-semibold"
            >
                <i class="pi pi-shield text-xs text-primary"></i>
                Secure Local-First Environment
            </div>
        </div>
    </div>
</div>
