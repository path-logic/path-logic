<div class="border-b border-surface-200 bg-surface-0/80 backdrop-blur-md sticky top-0 z-[60]">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <a routerLink="/" class="flex items-center gap-2 group min-h-[44px]">
                <div
                    class="w-6 h-6 bg-primary rounded-sm flex items-center justify-center group-hover:shadow-[0_0_10px_rgba(56,189,248,0.5)] transition-all"
                    aria-hidden="true"
                >
                    <span class="text-white font-black text-xs">P</span>
                </div>
                <span
                    class="font-black text-sm tracking-tighter uppercase text-surface-900"
                    aria-label="Path Logic"
                    >PATH <span class="text-primary">LOGIC</span></span
                >
            </a>

            <nav class="hidden md:flex items-center gap-1">
                @for (item of navItems; track item.name) {
                    <a
                        [routerLink]="item.href"
                        routerLinkActive="text-primary bg-primary/10"
                        [routerLinkActiveOptions]="{ exact: item.href === '/' }"
                        class="px-3 min-h-[44px] flex items-center text-sm font-medium transition-colors rounded-lg text-surface-500 hover:text-surface-900 hover:bg-surface-100"
                    >
                        {{ item.name }}
                    </a>
                }
            </nav>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex flex-col items-end mr-4">
                <span class="text-xs text-surface-500 font-medium"> Net Position </span>
                <span
                    class="text-sm font-semibold leading-none"
                    [class.text-red-400]="netBalance() < 0"
                    [class.text-primary]="netBalance() >= 0"
                >
                    {{ formattedNetBalance() }}
                </span>
            </div>

            <!-- Theme Switcher & Divider -->
            <div class="h-8 w-px bg-surface-200 mr-2"></div>
            <button
                (click)="toggleTheme()"
                [title]="
                    themeService.resolvedTheme() === 'dark'
                        ? 'Switch to Light Mode'
                        : 'Switch to Dark Mode'
                "
                class="w-[44px] h-[44px] rounded-full flex items-center justify-center text-surface-500 hover:text-surface-900 hover:bg-surface-100 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-0"
            >
                <i
                    class="pi text-lg"
                    [class.pi-moon]="themeService.resolvedTheme() === 'dark'"
                    [class.pi-sun]="themeService.resolvedTheme() !== 'dark'"
                ></i>
            </button>

            <!-- User avatar / dropdown -->
            <div class="relative">
                <button
                    (click)="toggleUserMenu()"
                    aria-label="User menu"
                    [attr.aria-expanded]="showUserMenu()"
                    class="w-[44px] h-[44px] rounded-full flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-0"
                >
                    <div
                        class="w-8 h-8 rounded-full overflow-hidden border-2 border-surface-300 hover:border-primary transition-colors"
                    >
                        @if (userPhotoUrl()) {
                            <img
                                [src]="userPhotoUrl()"
                                [alt]="userName()"
                                referrerpolicy="no-referrer"
                                class="w-full h-full object-cover"
                            />
                        } @else {
                            <div class="w-full h-full bg-primary flex items-center justify-center">
                                <span class="text-white font-bold text-xs">
                                    {{ userInitial() }}
                                </span>
                            </div>
                        }
                    </div>
                </button>

                @if (showUserMenu()) {
                    <div
                        class="absolute right-0 top-full mt-2 w-56 bg-surface-0 border border-surface-200 rounded-xl shadow-2xl z-50 overflow-hidden"
                    >
                        <!-- User info header -->
                        <div class="flex items-center gap-3 px-3 py-3 border-b border-surface-200">
                            @if (userPhotoUrl()) {
                                <img
                                    [src]="userPhotoUrl()"
                                    [alt]="userName()"
                                    referrerpolicy="no-referrer"
                                    class="w-10 h-10 rounded-full object-cover border border-surface-300 flex-shrink-0"
                                />
                            } @else {
                                <div
                                    class="w-10 h-10 rounded-full bg-primary flex items-center justify-center flex-shrink-0"
                                >
                                    <span class="text-white font-bold text-sm">
                                        {{ userInitial() }}
                                    </span>
                                </div>
                            }
                            <div class="flex flex-col overflow-hidden">
                                <span class="text-sm font-bold text-surface-900 truncate">
                                    {{ userName() }}
                                </span>
                                <span class="text-[10px] text-surface-500 truncate">
                                    {{ userEmail() }}
                                </span>
                            </div>
                        </div>
                        <!-- Menu actions -->
                        <div class="py-1">
                            <button
                                type="button"
                                class="w-full text-left px-3 min-h-[44px] flex items-center text-sm font-medium hover:bg-surface-100 cursor-pointer text-surface-700 transition-colors"
                            >
                                Profile Settings
                            </button>
                            <button
                                type="button"
                                (click)="handleSignOut()"
                                class="w-full text-left px-3 min-h-[44px] flex items-center text-sm font-medium hover:bg-surface-100 cursor-pointer text-red-400 transition-colors"
                            >
                                Sign Out
                            </button>
                        </div>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
