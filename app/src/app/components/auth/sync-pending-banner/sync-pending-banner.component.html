@if (showBanner()) {
    <div class="sync-pending-banner" role="alert" aria-live="assertive">
        <!-- Pulsing attention dot -->
        <span class="pulse-ring" aria-hidden="true"></span>

        <div class="banner-content">
            <div class="banner-left">
                <i class="pi pi-wifi banner-icon"></i>
                <div class="banner-text">
                    <span class="banner-title">Cloud Sync Disconnected</span>
                    <span class="banner-subtitle">
                        Your data is saved on this device only — changes will not appear on other
                        devices until you reconnect.
                    </span>
                </div>
            </div>

            <button class="reauth-btn" (click)="reAuthenticate()" type="button">
                <i class="pi pi-refresh btn-icon"></i>
                Reconnect to Google Drive
            </button>
        </div>
    </div>
}
