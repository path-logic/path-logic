<div class="split-editor-container">
    <!-- Debit / Deposit Mode -->
    @if (scheduleType !== ScheduleType.Paycheck) {
        <div>
            <p-table
                [value]="editingSplits"
                [scrollable]="true"
                scrollHeight="400px"
                styleClass="p-datatable-sm"
            >
                <ng-template pTemplate="header">
                    <tr>
                        <th>Category</th>
                        <th>Memo</th>
                        <th>Amount</th>
                        <th style="width: 4rem"><span class="sr-only">Actions</span></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-split let-i="rowIndex">
                    <tr>
                        <td>
                            <input
                                pInputText
                                aria-label="Split category"
                                [attr.aria-label]="'Split category ' + (i + 1)"
                                [ngModel]="split.categoryId"
                                (ngModelChange)="updateSplit(i, 'categoryId', $event)"
                                class="w-full text-sm"
                                placeholder="Category ID..."
                            />
                        </td>
                        <td>
                            <input
                                pInputText
                                aria-label="Split memo"
                                [attr.aria-label]="'Split memo ' + (i + 1)"
                                [ngModel]="split.memo"
                                (ngModelChange)="updateSplit(i, 'memo', $event)"
                                class="w-full text-sm"
                                placeholder="Memo..."
                            />
                        </td>
                        <td>
                            <calculator-input
                                [ngModel]="split.amount"
                                (ngModelChange)="updateSplit(i, 'amount', $event)"
                                [placeholder]="'$0.00'"
                                ariaLabel="Split amount"
                            ></calculator-input>
                        </td>
                        <td>
                            <p-button
                                icon="pi pi-times"
                                [rounded]="true"
                                [text]="true"
                                severity="danger"
                                ariaLabel="Remove split line"
                                [attr.aria-label]="'Remove split line'"
                                (onClick)="removeSplit(split.id)"
                            >
                                <span class="sr-only">Remove split line</span>
                            </p-button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            <div class="mt-4 flex justify-end">
                <p-button
                    label="Add Split"
                    icon="pi pi-plus"
                    size="small"
                    [outlined]="true"
                    (onClick)="addSplit()"
                ></p-button>
            </div>
        </div>
    }

    <!-- Paycheck Mode -->
    @if (scheduleType === ScheduleType.Paycheck) {
        <div class="flex flex-col gap-6">
            <!-- Wages -->
            <div class="p-fluid">
                <h4
                    class="text-sm font-semibold text-surface-600 uppercase tracking-wider mb-2 border-b pb-1"
                >
                    Wages
                </h4>
                <div class="flex items-center justify-between py-2">
                    <label for="grossPay" class="w-1/3 text-sm">Gross Pay</label>
                    <div class="w-2/3">
                        <calculator-input
                            [ngModel]="paycheckState.grossPay"
                            (ngModelChange)="updatePaycheckField('grossPay', $event)"
                        ></calculator-input>
                    </div>
                </div>
            </div>

            <!-- Taxes -->
            <div class="p-fluid">
                <h4
                    class="text-sm font-semibold text-surface-600 uppercase tracking-wider mb-2 border-b pb-1"
                >
                    Taxes
                </h4>
                <div class="flex items-center justify-between py-2">
                    <label for="federalTax" class="w-1/3 text-sm">Federal Tax</label>
                    <div class="w-2/3">
                        <calculator-input
                            [ngModel]="paycheckState.federalTax"
                            (ngModelChange)="updatePaycheckField('federalTax', $event)"
                        ></calculator-input>
                    </div>
                </div>
                <div class="flex items-center justify-between py-2">
                    <label for="stateTax" class="w-1/3 text-sm">State Tax</label>
                    <div class="w-2/3">
                        <calculator-input
                            [ngModel]="paycheckState.stateTax"
                            (ngModelChange)="updatePaycheckField('stateTax', $event)"
                        ></calculator-input>
                    </div>
                </div>
                <div class="flex items-center justify-between py-2">
                    <label for="socialSecurity" class="w-1/3 text-sm">Social Security</label>
                    <div class="w-2/3">
                        <calculator-input
                            [ngModel]="paycheckState.socialSecurity"
                            (ngModelChange)="updatePaycheckField('socialSecurity', $event)"
                        ></calculator-input>
                    </div>
                </div>
                <div class="flex items-center justify-between py-2">
                    <label for="medicare" class="w-1/3 text-sm">Medicare</label>
                    <div class="w-2/3">
                        <calculator-input
                            [ngModel]="paycheckState.medicare"
                            (ngModelChange)="updatePaycheckField('medicare', $event)"
                        ></calculator-input>
                    </div>
                </div>
            </div>

            <!-- Pre-Tax Deductions -->
            <div class="p-fluid">
                <h4
                    class="text-sm font-semibold text-surface-600 uppercase tracking-wider mb-2 border-b pb-1"
                >
                    Pre-Tax Deductions
                </h4>
                <div class="flex items-center justify-between py-2">
                    <label for="fourOhOneK" class="w-1/3 text-sm">401k / Retirement</label>
                    <div class="w-2/3">
                        <calculator-input
                            [ngModel]="paycheckState.fourOhOneK"
                            (ngModelChange)="updatePaycheckField('fourOhOneK', $event)"
                        ></calculator-input>
                    </div>
                </div>
                <div class="flex items-center justify-between py-2">
                    <label for="healthInsurance" class="w-1/3 text-sm">Health Insurance</label>
                    <div class="w-2/3">
                        <calculator-input
                            [ngModel]="paycheckState.healthInsurance"
                            (ngModelChange)="updatePaycheckField('healthInsurance', $event)"
                        ></calculator-input>
                    </div>
                </div>
            </div>
        </div>
    }
</div>
