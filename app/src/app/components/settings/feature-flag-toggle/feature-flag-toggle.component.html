<div class="flex items-center justify-between p-4 px-5">
    <div class="flex-1">
        <div class="flex items-center gap-3">
            <p
                class="text-sm font-bold text-surface-800 dark:text-surface-100 uppercase tracking-tight"
            >
                {{ label() }}
            </p>
            @if (enabled() && config()?.route; as route) {
                <a
                    [routerLink]="route"
                    class="inline-flex items-center gap-1 rounded-full bg-primary/10 px-2.5 py-0.5 text-[10px] font-black uppercase tracking-widest text-primary transition-colors hover:bg-primary/20"
                >
                    Jump →
                </a>
            }
        </div>
        @if (description(); as desc) {
            <p
                class="mt-1 text-[10px] font-bold uppercase tracking-wider text-surface-600 dark:text-surface-300 leading-relaxed italic line-clamp-1"
            >
                {{ desc }}
            </p>
        }
    </div>

    <div class="ml-6 flex items-center gap-4">
        <span
            [class]="
                'text-[9px] font-black uppercase tracking-[0.2em] ' +
                (enabled()
                    ? 'text-emerald-700 dark:text-emerald-400'
                    : 'text-surface-600 dark:text-surface-400')
            "
        >
            {{ enabled() ? 'Active' : 'Offline' }}
        </span>

        <p-toggleswitch
            [ngModel]="enabled()"
            (ngModelChange)="toggle()"
            [ariaLabel]="'Toggle ' + label()"
            [attr.aria-label]="'Toggle ' + label()"
        ></p-toggleswitch>
    </div>
</div>
