@if (isVisible()) {
    <div
        class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-surface-0/90 backdrop-blur-sm"
        role="status"
        aria-live="polite"
    >
        <!-- Stage pipeline indicator -->
        <div class="flex items-center gap-2 mb-6">
            @for (stage of stages; track $index; let i = $index) {
                <div class="flex items-center gap-2">
                    <div
                        [class]="
                            'w-6 h-6 rounded-full flex items-center justify-center text-[9px] font-black transition-all duration-300 ' +
                            (i < stageIndex()
                                ? 'bg-primary text-white'
                                : i === stageIndex()
                                  ? 'bg-primary text-white ring-4 ring-primary/20 animate-pulse'
                                  : 'bg-surface-200 text-surface-500')
                        "
                    >
                        @if (i < stageIndex()) {
                            ✓
                        } @else {
                            {{ i + 1 }}
                        }
                    </div>
                    <span
                        [class]="
                            'text-[9px] font-black uppercase tracking-widest hidden sm:block ' +
                            (i <= stageIndex() ? 'text-primary' : 'text-surface-400')
                        "
                        >{{ stage }}</span
                    >
                    @if (i < stages.length - 1) {
                        <div
                            [class]="
                                'w-6 h-px transition-all duration-500 ' +
                                (i < stageIndex() ? 'bg-primary' : 'bg-surface-200')
                            "
                        ></div>
                    }
                </div>
            }
        </div>

        <!-- Progress bar -->
        <div class="w-72 h-1.5 bg-surface-200 rounded-full overflow-hidden mb-4">
            <div
                class="h-full bg-gradient-to-r from-primary to-primary/70 rounded-full transition-all duration-300 ease-out"
                [style.width.%]="progress().pct"
            ></div>
        </div>

        <!-- Stage label + counter -->
        <p class="text-[11px] font-black uppercase tracking-[0.2em] text-primary">
            {{ stageLabel() }}
        </p>
        @if (counterText()) {
            <p class="text-[10px] font-mono text-surface-500 mt-1 tabular-nums">
                {{ counterText() }}
            </p>
        }

        <!-- Cancel -->
        <button
            (click)="handleCancel()"
            class="mt-6 flex items-center gap-1.5 text-[9px] font-black uppercase tracking-widest text-surface-400 hover:text-surface-700 transition-colors"
        >
            <lucide-icon [img]="X" class="w-3 h-3" />
            Cancel Import
        </button>
    </div>
}
