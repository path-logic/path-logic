<p-dialog
    [(visible)]="isOpen"
    [modal]="true"
    [closable]="!isProcessing()"
    [style]="{ width: '500px' }"
    styleClass="penny-dialog express-import-dialog"
>
    <!-- ═══════════════════════════════════ HEADER ═══════════════════════════════ -->
    <ng-template pTemplate="header">
        <div class="flex items-center gap-3">
            <i class="pi pi-exclamation-circle text-2xl text-primary"></i>
            <div>
                <h2 class="uppercase font-black tracking-widest text-primary text-xl m-0">
                    Import Review
                </h2>
                <p
                    class="text-[10px] uppercase font-bold text-surface-800/90 tracking-widest mt-1 m-0"
                >
                    {{ matches().length | number }} transactions from bank statement
                </p>
            </div>
        </div>
    </ng-template>

    <!-- ════════════════════════ EXPRESS MODE CONTENT ════════════════════════════ -->
    <div class="p-6 space-y-6">
        <div
            class="rounded-sm border border-primary/20 bg-gradient-to-br from-primary/5 to-transparent p-6 text-center"
        >
            <h3 class="text-lg font-black tracking-tight mb-1">Express Import Ready</h3>
            <p class="text-sm text-surface-600 mb-6 max-w-sm mx-auto">
                No ambiguous matches found.
                <strong>{{ importStats()?.newCount | number }}</strong> new transactions will be
                imported and <strong>{{ importStats()?.exactCount | number }}</strong> duplicates
                will be skipped automatically.
            </p>
            <div class="flex justify-center gap-3">
                <p-button
                    (click)="handleExpressImport()"
                    [loading]="isProcessing()"
                    [label]="isProcessing() ? 'Importing...' : 'Express Import'"
                    icon="pi pi-bolt"
                    severity="primary"
                    styleClass="pl-btn-primary h-10 px-6 text-[11px] uppercase tracking-widest rounded-md"
                />
                <p-button
                    (click)="onReviewFirst()"
                    label="Review First"
                    [disabled]="isProcessing()"
                    severity="secondary"
                    styleClass="pl-btn-text h-10 px-6 text-[11px] font-black uppercase tracking-widest rounded-md"
                />
            </div>
            <div class="mt-4 pt-4 border-t border-primary/10 text-center">
                <button
                    (click)="onClose()"
                    class="text-[10px] text-surface-400 hover:text-surface-600 uppercase font-bold tracking-widest transition-colors cursor-pointer"
                >
                    Abandon Import
                </button>
            </div>
        </div>
    </div>
</p-dialog>
