<p-dialog
    [(visible)]="visible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [closable]="false"
    [dismissableMask]="true"
    position="bottom"
    maskStyleClass="mobile-bottom-sheet-mask"
    styleClass="mobile-bottom-sheet overflow-hidden rounded-t-3xl border-t border-brand-border bg-brand-surface text-content-primary shadow-2xl max-h-[94dvh] flex flex-col z-50"
    ariaLabel="Transaction Entry Sheet"
    appendTo="body"
>
    <!-- Header with Drag Handle, Clear Cancel & Quick Save Actions -->
    <ng-template pTemplate="header">
        <div class="flex flex-col items-center w-full relative pt-2 pb-1 bg-brand-surface">
            <div class="w-12 h-1.5 rounded-full bg-surface-300 dark:bg-surface-700 mb-2.5"></div>
            <div class="flex items-center justify-between w-full px-1">
                <button
                    type="button"
                    (click)="close()"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-bold text-content-muted hover:text-content-primary hover:bg-brand-elevated transition-colors min-h-[38px] flex items-center gap-1.5 cursor-pointer border border-brand-border bg-brand-base"
                    aria-label="Cancel transaction editing"
                >
                    <i class="pi pi-times text-xs"></i>
                    <span>Cancel</span>
                </button>

                <h2 class="text-xs font-bold uppercase tracking-wider text-content-primary">
                    {{ transaction() ? 'Edit Transaction' : 'New Transaction' }}
                </h2>

                <button
                    type="button"
                    (click)="save()"
                    [disabled]="!isFormValid()"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-primary text-white disabled:opacity-40 hover:bg-primary/90 transition-colors min-h-[38px] flex items-center gap-1 cursor-pointer disabled:cursor-not-allowed shadow-xs"
                    aria-label="Save transaction"
                >
                    <i class="pi pi-check text-xs"></i>
                    <span>Save</span>
                </button>
            </div>
        </div>
    </ng-template>

    <!-- Scrollable Sheet Body -->
    <div
        class="p-4 sm:p-5 space-y-3.5 overflow-y-auto flex-1 bg-brand-surface text-content-primary"
    >
        <!-- Segmented Mode Pills -->
        <div
            class="grid grid-cols-3 p-1 rounded-2xl bg-brand-base border border-brand-border"
            role="radiogroup"
            aria-label="Transaction type"
        >
            <button
                type="button"
                role="radio"
                [attr.aria-checked]="mode() === 'expense'"
                (click)="setMode('expense')"
                [class]="
                    mode() === 'expense'
                        ? 'h-10 rounded-xl font-bold text-xs bg-primary text-white shadow-sm transition-all flex items-center justify-center gap-1.5 cursor-pointer'
                        : 'h-10 rounded-xl font-semibold text-xs text-content-muted hover:text-content-primary transition-colors flex items-center justify-center gap-1.5 cursor-pointer'
                "
            >
                <i class="pi pi-arrow-down-right text-xs"></i>
                <span>Expense</span>
            </button>
            <button
                type="button"
                role="radio"
                [attr.aria-checked]="mode() === 'deposit'"
                (click)="setMode('deposit')"
                [class]="
                    mode() === 'deposit'
                        ? 'h-10 rounded-xl font-bold text-xs bg-emerald-600 text-white shadow-sm transition-all flex items-center justify-center gap-1.5 cursor-pointer'
                        : 'h-10 rounded-xl font-semibold text-xs text-content-muted hover:text-content-primary transition-colors flex items-center justify-center gap-1.5 cursor-pointer'
                "
            >
                <i class="pi pi-arrow-up-right text-xs"></i>
                <span>Deposit</span>
            </button>
            <button
                type="button"
                role="radio"
                [attr.aria-checked]="mode() === 'transfer'"
                (click)="setMode('transfer')"
                [class]="
                    mode() === 'transfer'
                        ? 'h-10 rounded-xl font-bold text-xs bg-indigo-600 text-white shadow-sm transition-all flex items-center justify-center gap-1.5 cursor-pointer'
                        : 'h-10 rounded-xl font-semibold text-xs text-content-muted hover:text-content-primary transition-colors flex items-center justify-center gap-1.5 cursor-pointer'
                "
            >
                <i class="pi pi-arrows-h text-xs"></i>
                <span>Transfer</span>
            </button>
        </div>

        <!-- Hero Amount Display -->
        <div
            class="py-3.5 px-3 rounded-2xl bg-brand-base border border-brand-border text-center space-y-0.5"
            role="region"
            aria-live="polite"
            [attr.aria-label]="'Transaction amount: ' + formattedHeroAmount()"
        >
            <p class="text-[10px] font-bold uppercase tracking-wider text-content-muted">Amount</p>
            <div
                class="text-4xl sm:text-5xl font-extrabold tracking-tight transition-colors"
                [class]="
                    mode() === 'deposit'
                        ? 'text-emerald-700 dark:text-emerald-400'
                        : mode() === 'expense'
                          ? 'text-red-500 dark:text-red-400'
                          : 'text-content-primary'
                "
            >
                {{ formattedHeroAmount() }}
            </div>
        </div>

        <!-- Consistent Form Inputs -->
        <div class="space-y-3">
            <!-- Transfer Destination -->
            @if (mode() === 'transfer') {
                <div class="space-y-1.5">
                    <label
                        for="mobile-transfer-to"
                        class="text-xs font-semibold text-content-primary flex items-center gap-1.5"
                    >
                        <i class="pi pi-building text-content-muted text-xs"></i>
                        <span>Transfer Destination</span>
                    </label>
                    <select
                        id="mobile-transfer-to"
                        [ngModel]="transferToAccountId()"
                        (ngModelChange)="transferToAccountId.set($event)"
                        class="w-full min-h-[44px] px-3.5 bg-brand-base border border-brand-border rounded-xl text-xs font-bold text-content-primary appearance-none cursor-pointer focus:ring-2 focus:ring-primary focus:outline-none"
                    >
                        <option value="" disabled selected>Select destination account...</option>
                        @for (acc of accounts(); track acc.id) {
                            @if (acc.id !== accountId()) {
                                <option [value]="acc.id">{{ acc.name }}</option>
                            }
                        }
                    </select>
                </div>
            } @else {
                <!-- Payee Autocomplete -->
                <div class="space-y-1.5">
                    <label
                        for="mobile-payee"
                        class="text-xs font-semibold text-content-primary flex items-center gap-1.5"
                    >
                        <i class="pi pi-user text-content-muted text-xs"></i>
                        <span>{{
                            mode() === 'expense' ? 'Pay To / Merchant' : 'Received From'
                        }}</span>
                    </label>
                    <div class="w-full min-h-[44px]">
                        <payee-autocomplete
                            inputId="mobile-payee"
                            name="payee"
                            [ngModel]="selectedPayee()"
                            (ngModelChange)="onPayeeSelected($event)"
                            styleClass="w-full"
                            inputStyleClass="w-full min-h-[44px] text-xs px-3.5 bg-brand-base border border-brand-border text-content-primary rounded-xl focus:ring-2 focus:ring-primary focus:outline-none placeholder:text-content-muted"
                        ></payee-autocomplete>
                    </div>
                </div>

                <!-- Category with Split Button -->
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label
                            for="mobile-category"
                            class="text-xs font-semibold text-content-primary flex items-center gap-1.5"
                        >
                            <i class="pi pi-tag text-content-muted text-xs"></i>
                            <span>Category</span>
                        </label>
                        <button
                            type="button"
                            (click)="openSplitDialog()"
                            class="px-2.5 py-1 rounded-xl text-[11px] font-bold transition flex items-center gap-1 border min-h-[32px] cursor-pointer"
                            [class]="
                                manualSplits().length > 0
                                    ? 'bg-primary/10 text-primary border-primary/30'
                                    : 'bg-brand-elevated text-content-muted border-brand-border hover:text-content-primary'
                            "
                            aria-label="Configure split categories"
                        >
                            <i class="pi pi-sitemap text-[10px]"></i>
                            <span>{{
                                manualSplits().length > 0
                                    ? manualSplits().length + ' Splits'
                                    : 'Split'
                            }}</span>
                        </button>
                    </div>

                    <p-autoComplete
                        inputId="mobile-category"
                        [ngModel]="selectedCategory()"
                        (ngModelChange)="selectedCategory.set($event)"
                        [suggestions]="filteredCategories()"
                        (completeMethod)="filterCategories($event)"
                        optionLabel="name"
                        [placeholder]="
                            manualSplits().length > 0 ? 'Split Transaction' : 'Select category...'
                        "
                        [disabled]="manualSplits().length > 0"
                        styleClass="w-full"
                        inputStyleClass="w-full min-h-[44px] text-xs px-3.5 bg-brand-base border border-brand-border text-content-primary rounded-xl focus:ring-2 focus:ring-primary focus:outline-none placeholder:text-content-muted"
                        [dropdown]="true"
                        appendTo="body"
                    ></p-autoComplete>
                </div>
            }

            <!-- Date & Memo in 2 Columns -->
            <div class="grid grid-cols-2 gap-3 pt-0.5">
                <div class="space-y-1">
                    <label
                        for="mobile-date"
                        class="text-xs font-semibold text-content-primary flex items-center gap-1"
                    >
                        <i class="pi pi-calendar text-content-muted text-xs"></i>
                        <span>Date</span>
                    </label>
                    <input
                        id="mobile-date"
                        type="date"
                        [ngModel]="entryDate()"
                        (ngModelChange)="entryDate.set($event)"
                        class="w-full min-h-[44px] text-xs px-3 bg-brand-base border border-brand-border text-content-primary rounded-xl focus:ring-2 focus:ring-primary focus:outline-none"
                    />
                </div>
                <div class="space-y-1">
                    <label
                        for="mobile-memo"
                        class="text-xs font-semibold text-content-primary flex items-center gap-1"
                    >
                        <i class="pi pi-pencil text-content-muted text-xs"></i>
                        <span>Memo</span>
                    </label>
                    <input
                        id="mobile-memo"
                        type="text"
                        placeholder="Optional note"
                        [ngModel]="entryMemo()"
                        (ngModelChange)="entryMemo.set($event)"
                        class="w-full min-h-[44px] text-xs px-3 bg-brand-base border border-brand-border text-content-primary rounded-xl focus:ring-2 focus:ring-primary focus:outline-none placeholder:text-content-muted"
                    />
                </div>
            </div>
        </div>

        <!-- Touch Numeric Keypad -->
        <div class="pt-1">
            <div
                class="grid grid-cols-3 gap-2 p-2 rounded-2xl bg-brand-base border border-brand-border"
                role="group"
                aria-label="Numeric keypad"
            >
                @for (key of ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0']; track key) {
                    <button
                        type="button"
                        (click)="onKeypadPress(key)"
                        class="h-11 rounded-xl text-base font-bold font-mono bg-brand-elevated text-content-primary border border-brand-border active:scale-95 transition shadow-xs flex items-center justify-center hover:bg-brand-surface cursor-pointer"
                        [attr.aria-label]="'Keypad ' + key"
                    >
                        {{ key }}
                    </button>
                }
                <!-- Backspace Key with crisp SVG icon -->
                <button
                    type="button"
                    (click)="onKeypadBackspace()"
                    class="h-11 rounded-xl text-base font-bold bg-brand-elevated text-content-primary border border-brand-border active:scale-95 transition shadow-xs flex items-center justify-center hover:bg-brand-surface cursor-pointer text-red-500"
                    aria-label="Backspace"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414a2 2 0 011.414-.586H19a2 2 0 012 2v10a2 2 0 01-2 2h-8.172a2 2 0 01-1.414-.586L3 12z"
                        />
                    </svg>
                </button>
            </div>
        </div>

        <!-- When editing, show Delete Action at the bottom of the form -->
        @if (transaction()) {
            <div class="pt-2">
                <button
                    type="button"
                    (click)="deleteTransaction()"
                    class="w-full h-11 rounded-xl font-bold text-xs border border-red-500/30 bg-red-500/10 text-red-500 hover:bg-red-500/20 transition flex items-center justify-center gap-1.5 cursor-pointer"
                    aria-label="Delete transaction"
                >
                    <i class="pi pi-trash text-xs"></i>
                    <span>Delete Transaction</span>
                </button>
            </div>
        }
    </div>
</p-dialog>

<!-- Sub Split Dialog -->
<split-entry-dialog
    [(isOpen)]="isSplitDialogOpen"
    [initialSplits]="manualSplits()"
    [totalAmount]="amountCents()"
    (saved)="handleSplitsSaved($event)"
></split-entry-dialog>
