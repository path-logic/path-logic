<div class="relative inline-block w-full select-none" (keydown)="onKeyDown($event)">
    <!-- Trigger Button -->
    <button
        type="button"
        (click)="toggleDropdown()"
        aria-haspopup="listbox"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-controls]="isOpen() ? 'account-dropdown-listbox' : null"
        [attr.aria-label]="ariaLabel()"
        class="w-full flex items-center justify-between gap-2.5 bg-surface-0 dark:bg-surface-900 border border-surface-200/90 dark:border-surface-700/80 rounded-2xl hover:border-primary/50 dark:hover:border-primary/50 transition-all duration-150 cursor-pointer shadow-2xs focus:outline-none focus:ring-2 focus:ring-primary/40 text-left"
        [class.px-3]="size() === 'sm'"
        [class.py-2]="size() === 'sm'"
        [class.min-h-[40px]]="size() === 'sm'"
        [class.px-3.5]="size() === 'md' || size() === 'lg'"
        [class.py-2.5]="size() === 'md'"
        [class.min-h-[44px]]="size() === 'md' || size() === 'lg'"
        [class.border-primary]="isOpen()"
        [class.ring-2]="isOpen()"
    >
        @if (selectedAccount(); as active) {
            <div class="flex items-center gap-2.5 min-w-0 flex-1">
                <!-- Icon Badge -->
                <div
                    class="w-7 h-7 rounded-xl flex items-center justify-center shrink-0 border"
                    [class]="
                        getAccountStyle(active.type).iconBg +
                        ' ' +
                        getAccountStyle(active.type).iconColor +
                        ' border-current/20'
                    "
                >
                    <i [class]="'pi ' + getAccountStyle(active.type).icon + ' text-xs'"></i>
                </div>

                <!-- Account Info -->
                <div class="flex items-center gap-2 min-w-0 flex-1">
                    <span
                        class="text-xs sm:text-sm font-bold text-surface-900 dark:text-surface-100 truncate"
                    >
                        {{ active.name }}
                    </span>
                    <span class="text-surface-300 dark:text-surface-600 shrink-0 font-light"
                        >•</span
                    >
                    <span
                        class="text-xs sm:text-sm font-mono font-bold shrink-0 tracking-tight"
                        [class.text-emerald-700]="getBalance(active) > 0"
                        [class.dark:text-emerald-400]="getBalance(active) > 0"
                        [class.text-red-700]="getBalance(active) < 0"
                        [class.dark:text-red-400]="getBalance(active) < 0"
                        [class.text-surface-600]="getBalance(active) === 0"
                        [class.dark:text-surface-300]="getBalance(active) === 0"
                    >
                        {{ formatCurrency(getBalance(active)) }}
                    </span>
                </div>
            </div>
        } @else {
            <span class="text-xs text-surface-400 font-medium">No account selected</span>
        }

        <!-- Chevron Indicator -->
        <i
            class="pi pi-chevron-down text-xs text-surface-400 dark:text-surface-500 transition-transform duration-200 shrink-0 ml-1"
            [class.rotate-180]="isOpen()"
        ></i>
    </button>

    <!-- Dropdown Menu / Popover Overlay -->
    @if (isOpen()) {
        <div
            id="account-dropdown-listbox"
            role="listbox"
            tabindex="-1"
            class="absolute left-0 top-full mt-1.5 w-full min-w-[280px] max-h-80 overflow-y-auto z-50 bg-surface-0/95 dark:bg-surface-900/95 backdrop-blur-xl border border-surface-200 dark:border-surface-700 rounded-2xl shadow-2xl p-1.5 space-y-1 animate-in fade-in zoom-in-95 duration-150"
        >
            <!-- Accounts List -->
            @for (acc of accounts(); track acc.id; let i = $index) {
                <button
                    type="button"
                    role="option"
                    (click)="selectAccount(acc)"
                    [attr.aria-selected]="acc.id === selectedAccountId()"
                    class="w-full flex items-center justify-between gap-3 p-2.5 rounded-xl text-left transition-colors cursor-pointer"
                    [class.bg-surface-100]="
                        (highlightedIndex() === i && acc.id !== selectedAccountId()) ||
                        acc.id === selectedAccountId()
                    "
                    [class.dark:bg-surface-800]="
                        (highlightedIndex() === i && acc.id !== selectedAccountId()) ||
                        acc.id === selectedAccountId()
                    "
                    [class.border]="acc.id === selectedAccountId()"
                    [class.border-primary]="acc.id === selectedAccountId()"
                    [class.hover:bg-surface-100]="acc.id !== selectedAccountId()"
                    [class.dark:hover:bg-surface-800]="acc.id !== selectedAccountId()"
                >
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                        <!-- Type Icon -->
                        <div
                            class="w-7 h-7 rounded-xl flex items-center justify-center shrink-0 border"
                            [class]="
                                getAccountStyle(acc.type).iconBg +
                                ' ' +
                                getAccountStyle(acc.type).iconColor +
                                ' border-current/20'
                            "
                        >
                            <i [class]="'pi ' + getAccountStyle(acc.type).icon + ' text-xs'"></i>
                        </div>

                        <!-- Name & Institution -->
                        <div class="min-w-0 flex-1 flex flex-col">
                            <span
                                class="text-xs font-bold text-surface-900 dark:text-surface-100 truncate"
                            >
                                {{ acc.name }}
                            </span>
                            @if (acc.institutionName) {
                                <span class="text-[10px] text-surface-500 truncate">
                                    {{ acc.institutionName }} ·
                                    {{ getAccountStyle(acc.type).label }}
                                </span>
                            } @else {
                                <span class="text-[10px] text-surface-500 truncate">
                                    {{ getAccountStyle(acc.type).label }}
                                </span>
                            }
                        </div>
                    </div>

                    <!-- Balance & Active Checkmark -->
                    <div class="flex items-center gap-2 shrink-0">
                        <span
                            class="text-xs font-mono font-bold tracking-tight"
                            [class.text-emerald-700]="getBalance(acc) > 0"
                            [class.dark:text-emerald-400]="getBalance(acc) > 0"
                            [class.text-red-700]="getBalance(acc) < 0"
                            [class.dark:text-red-400]="getBalance(acc) < 0"
                            [class.text-surface-600]="getBalance(acc) === 0"
                            [class.dark:text-surface-300]="getBalance(acc) === 0"
                        >
                            {{ formatCurrency(getBalance(acc)) }}
                        </span>

                        @if (acc.id === selectedAccountId()) {
                            <i class="pi pi-check text-xs text-primary font-bold"></i>
                        }
                    </div>
                </button>
            }

            <!-- Add Account Option -->
            @if (showAddOption()) {
                <div class="pt-1 border-t border-surface-200/80 dark:border-surface-800">
                    <button
                        type="button"
                        (click)="triggerAddAccount()"
                        class="w-full flex items-center gap-2.5 p-2 rounded-xl text-xs font-bold text-primary hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors cursor-pointer"
                    >
                        <i class="pi pi-plus-circle text-xs"></i>
                        <span>Add New Account</span>
                    </button>
                </div>
            }
        </div>
    }
</div>
