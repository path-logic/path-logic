<div class="relative inline-block w-full select-none" (keydown)="onKeyDown($event)">
    <!-- Trigger Button -->
    <button
        type="button"
        (click)="toggleDropdown()"
        aria-haspopup="listbox"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-controls]="isOpen() ? 'account-dropdown-listbox' : null"
        [attr.aria-label]="ariaLabel()"
        class="w-full flex items-center justify-between gap-2.5 bg-surface-0 dark:bg-surface-900 border rounded-xl hover:border-primary/50 transition-all duration-150 cursor-pointer shadow-2xs focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/30 text-left"
        [class.border-primary]="isOpen()"
        [class.border-surface-200]="!isOpen()"
        [class.dark:border-surface-700]="!isOpen()"
        [class.px-2.5]="size() === 'sm'"
        [class.py-1.5]="size() === 'sm'"
        [class.min-h-[38px]]="size() === 'sm'"
        [class.px-3]="size() === 'md' || size() === 'lg'"
        [class.py-2]="size() === 'md' || size() === 'lg'"
        [class.min-h-[42px]]="size() === 'md' || size() === 'lg'"
    >
        @if (selectedAccount(); as active) {
            <div class="flex items-center gap-2.5 min-w-0 flex-1">
                <!-- Icon Badge -->
                <div
                    class="w-6 h-6 rounded-lg flex items-center justify-center shrink-0 border"
                    [class]="
                        getAccountStyle(active.type).iconBg +
                        ' ' +
                        getAccountStyle(active.type).iconColor +
                        ' border-current/20'
                    "
                >
                    <i [class]="'pi ' + getAccountStyle(active.type).icon + ' text-[11px]'"></i>
                </div>

                <!-- Account Name -->
                <span class="text-xs font-bold text-surface-900 dark:text-surface-100 truncate">
                    {{ active.name }}
                </span>
            </div>

            <!-- Balance & Chevron -->
            <div class="flex items-center gap-2 shrink-0 ml-1">
                <span
                    class="text-xs font-mono font-bold tracking-tight"
                    [class.text-emerald-700]="getBalance(active) > 0"
                    [class.dark:text-emerald-400]="getBalance(active) > 0"
                    [class.text-red-700]="getBalance(active) < 0"
                    [class.dark:text-red-400]="getBalance(active) < 0"
                    [class.text-surface-600]="getBalance(active) === 0"
                    [class.dark:text-surface-300]="getBalance(active) === 0"
                >
                    {{ formatCurrency(getBalance(active)) }}
                </span>

                <i
                    class="pi pi-chevron-down text-[10px] text-surface-400 dark:text-surface-500 transition-transform duration-200 shrink-0"
                    [class.rotate-180]="isOpen()"
                ></i>
            </div>
        } @else {
            <span class="text-xs text-surface-400 font-medium">No account selected</span>
            <i class="pi pi-chevron-down text-[10px] text-surface-400 shrink-0"></i>
        }
    </button>

    <!-- Dropdown Menu / Popover Overlay -->
    @if (isOpen()) {
        <div
            id="account-dropdown-listbox"
            role="listbox"
            tabindex="-1"
            class="absolute left-0 top-full mt-1.5 w-full min-w-[260px] max-h-72 overflow-y-auto z-50 bg-surface-0/98 dark:bg-surface-900/98 backdrop-blur-md border border-surface-200 dark:border-surface-700 rounded-xl shadow-lg p-1 space-y-0.5 animate-in fade-in zoom-in-95 duration-100"
        >
            <!-- Accounts List -->
            @for (acc of accounts(); track acc.id; let i = $index) {
                <button
                    type="button"
                    role="option"
                    (click)="selectAccount(acc)"
                    [attr.aria-selected]="acc.id === selectedAccountId()"
                    class="w-full flex items-center justify-between gap-2.5 px-2.5 py-2 rounded-lg text-left transition-colors cursor-pointer"
                    [class.bg-surface-100]="
                        (highlightedIndex() === i && acc.id !== selectedAccountId()) ||
                        acc.id === selectedAccountId()
                    "
                    [class.dark:bg-surface-800]="
                        (highlightedIndex() === i && acc.id !== selectedAccountId()) ||
                        acc.id === selectedAccountId()
                    "
                    [class.text-primary]="acc.id === selectedAccountId()"
                    [class.hover:bg-surface-100]="acc.id !== selectedAccountId()"
                    [class.dark:hover:bg-surface-800]="acc.id !== selectedAccountId()"
                >
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                        <!-- Type Icon -->
                        <div
                            class="w-6 h-6 rounded-lg flex items-center justify-center shrink-0 border"
                            [class]="
                                getAccountStyle(acc.type).iconBg +
                                ' ' +
                                getAccountStyle(acc.type).iconColor +
                                ' border-current/20'
                            "
                        >
                            <i
                                [class]="'pi ' + getAccountStyle(acc.type).icon + ' text-[11px]'"
                            ></i>
                        </div>

                        <!-- Name & Institution -->
                        <div class="min-w-0 flex-1 flex flex-col">
                            <span
                                class="text-xs font-bold text-surface-900 dark:text-surface-100 truncate"
                            >
                                {{ acc.name }}
                            </span>
                            @if (acc.institutionName) {
                                <span class="text-[10px] text-surface-500 truncate">
                                    {{ acc.institutionName }} ·
                                    {{ getAccountStyle(acc.type).label }}
                                </span>
                            } @else {
                                <span class="text-[10px] text-surface-500 truncate">
                                    {{ getAccountStyle(acc.type).label }}
                                </span>
                            }
                        </div>
                    </div>

                    <!-- Balance & Active Checkmark -->
                    <div class="flex items-center gap-2 shrink-0">
                        <span
                            class="text-xs font-mono font-bold tracking-tight"
                            [class.text-emerald-700]="getBalance(acc) > 0"
                            [class.dark:text-emerald-400]="getBalance(acc) > 0"
                            [class.text-red-700]="getBalance(acc) < 0"
                            [class.dark:text-red-400]="getBalance(acc) < 0"
                            [class.text-surface-600]="getBalance(acc) === 0"
                            [class.dark:text-surface-300]="getBalance(acc) === 0"
                        >
                            {{ formatCurrency(getBalance(acc)) }}
                        </span>

                        @if (acc.id === selectedAccountId()) {
                            <i class="pi pi-check text-xs text-primary font-bold"></i>
                        }
                    </div>
                </button>
            }

            <!-- Add Account Option -->
            @if (showAddOption()) {
                <div class="pt-1 mt-1 border-t border-surface-200/80 dark:border-surface-800">
                    <button
                        type="button"
                        (click)="triggerAddAccount()"
                        class="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs font-bold text-primary hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors cursor-pointer"
                    >
                        <i class="pi pi-plus-circle text-xs"></i>
                        <span>Add New Account</span>
                    </button>
                </div>
            }
        </div>
    }
</div>
