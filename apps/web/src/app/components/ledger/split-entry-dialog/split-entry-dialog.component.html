@if (isOpen()) {
    <div
        role="dialog"
        aria-labelledby="split-dialog-title"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-background/80 backdrop-blur-sm animate-in fade-in duration-200"
    >
        <div
            class="w-full max-w-2xl bg-card border border-border rounded-lg shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200"
        >
            <!-- Header -->
            <div class="px-6 py-4 border-b border-border flex justify-between items-center">
                <h3
                    id="split-dialog-title"
                    class="text-sm font-black uppercase tracking-widest text-primary"
                >
                    Split Transaction Detail
                </h3>
                <button
                    (click)="onClose()"
                    aria-label="Close dialog"
                    class="text-muted-foreground hover:text-white transition-colors"
                >
                    <lucide-icon [img]="X" class="w-4 h-4" />
                </button>
            </div>

            <div class="p-6 space-y-4">
                <!-- Summary Header -->
                <div
                    class="flex justify-between items-center bg-accent/30 p-4 rounded-sm border border-border"
                >
                    <div>
                        <p
                            class="text-[9px] text-foreground/90 font-bold uppercase tracking-tighter mb-0.5"
                        >
                            Target Total
                        </p>
                        <p class="font-mono font-bold text-lg text-primary">
                            {{ formatCurrency(totalAmount()) }}
                        </p>
                    </div>
                    <div class="text-right">
                        <p
                            class="text-[9px] text-foreground/90 font-bold uppercase tracking-tighter mb-0.5"
                        >
                            Remaining
                        </p>
                        <p
                            class="font-mono font-bold text-lg"
                            [class.text-emerald-900]="isBalanced()"
                            [class.text-destructive]="!isBalanced()"
                            [class.animate-pulse]="!isBalanced()"
                        >
                            {{ formatCurrency(difference()) }}
                        </p>
                    </div>
                </div>

                <!-- Split Table -->
                <div class="space-y-2 max-h-[400px] overflow-y-auto pr-2 ledger-scroll">
                    @for (split of splits(); track split.id; let i = $index) {
                        <div
                            class="flex gap-3 items-center group animate-in slide-in-from-left-2"
                            [style.animation-delay]="i * 50 + 'ms'"
                        >
                            <div class="w-[180px]">
                                <select
                                    [ngModel]="split.categoryId ?? 'uncategorized'"
                                    (ngModelChange)="
                                        handleUpdateSplit(split.id, { categoryId: $event })
                                    "
                                    [attr.aria-label]="'Split category ' + (i + 1)"
                                    class="w-full h-8 text-[10px] uppercase font-bold bg-background border border-border rounded-md px-2 text-foreground focus:outline-none focus:ring-1 focus:ring-primary appearance-none"
                                >
                                    @for (cat of categories(); track cat.id) {
                                        <option [value]="cat.id">{{ cat.name }}</option>
                                    }
                                </select>
                            </div>
                            <div class="flex-1">
                                <input
                                    type="text"
                                    placeholder="Split Memo"
                                    [attr.aria-label]="'Split memo ' + (i + 1)"
                                    [ngModel]="split.memo"
                                    (ngModelChange)="handleUpdateSplit(split.id, { memo: $event })"
                                    class="w-full h-8 px-2 bg-background border border-border rounded-md text-[10px] focus:outline-none focus:ring-1 focus:ring-primary"
                                />
                            </div>
                            <div class="w-[120px]">
                                <input
                                    type="number"
                                    step="0.01"
                                    placeholder="0.00"
                                    [attr.aria-label]="'Split amount ' + (i + 1)"
                                    [ngModel]="centsToDollars(split.amount)"
                                    (ngModelChange)="
                                        handleUpdateSplit(split.id, {
                                            amount: dollarsToCents($event),
                                        })
                                    "
                                    class="w-full h-8 px-2 bg-background border border-border rounded-md text-[10px] font-mono text-right focus:outline-none focus:ring-1 focus:ring-primary"
                                />
                            </div>
                            <button
                                (click)="handleRemoveSplit(split.id)"
                                aria-label="Remove split line"
                                class="h-8 w-8 flex items-center justify-center text-destructive hover:bg-destructive/10 rounded-md transition-colors"
                            >
                                <lucide-icon [img]="Trash2" class="w-3.5 h-3.5" />
                            </button>
                        </div>
                    }
                </div>

                <button
                    (click)="handleAddSplit()"
                    aria-label="Add split line"
                    class="w-full border border-dashed border-border rounded-md text-foreground hover:text-primary hover:border-primary/50 text-[10px] font-bold uppercase h-9 transition-colors flex items-center justify-center gap-2"
                >
                    <lucide-icon [img]="Plus" class="w-3.5 h-3.5" />
                    Add Split Line
                </button>
            </div>

            <!-- Footer -->
            <div
                class="px-6 py-4 border-t border-border bg-muted/10 flex justify-between items-center gap-2"
            >
                @if (!isBalanced()) {
                    <div class="flex gap-2">
                        <button
                            (click)="handleAdjustTotal()"
                            aria-label="Adjust total"
                            class="border border-primary/30 bg-background text-primary text-[9px] font-black uppercase h-8 px-3 rounded-md hover:bg-primary/10 transition-colors flex items-center gap-2"
                        >
                            <lucide-icon [img]="Scale" class="w-3 h-3" />
                            Adjust Total to {{ formatCurrency(sumSplits()) }}
                        </button>
                        <button
                            (click)="handleQuickBalance()"
                            aria-label="Quick balance"
                            class="border border-emerald-700/30 bg-background text-emerald-900 text-[9px] font-black uppercase h-8 px-3 rounded-md hover:bg-emerald-700/10 transition-colors flex items-center gap-2"
                        >
                            <lucide-icon [img]="Calculator" class="w-3 h-3" />
                            Quick Balance
                        </button>
                    </div>
                } @else {
                    <div></div>
                }

                <div class="flex gap-2">
                    <button
                        (click)="onClose()"
                        class="text-[10px] font-bold uppercase h-8 px-4 text-muted-foreground hover:text-white transition-colors"
                    >
                        Cancel
                    </button>
                    <button
                        (click)="handleSave()"
                        [disabled]="!isBalanced()"
                        class="bg-primary hover:bg-primary/90 text-primary-foreground text-[10px] font-black uppercase h-8 px-6 rounded-md transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
                    >
                        Confirm Splits
                    </button>
                </div>
            </div>
        </div>
    </div>
}
