<div class="flex items-center justify-between p-4 px-5">
    <div class="flex-1">
        <div class="flex items-center gap-3">
            <p class="text-sm font-bold text-foreground uppercase tracking-tight">
                {{ label() }}
            </p>
            @if (enabled() && config()?.route; as route) {
                <a
                    [routerLink]="route"
                    class="inline-flex items-center gap-1 rounded-full bg-primary/10 px-2.5 py-0.5 text-[10px] font-black uppercase tracking-widest text-primary transition-colors hover:bg-primary/20"
                >
                    Jump →
                </a>
            }
        </div>
        @if (description(); as desc) {
            <p
                class="mt-1 text-[10px] font-bold uppercase tracking-wider text-foreground leading-relaxed italic line-clamp-1"
            >
                {{ desc }}
            </p>
        }
    </div>

    <div class="ml-6 flex items-center gap-4">
        <span
            [class]="
                'text-[9px] font-black uppercase tracking-[0.2em] ' +
                (enabled() ? 'text-emerald-900' : 'text-foreground/90')
            "
        >
            {{ enabled() ? 'Active' : 'Offline' }}
        </span>

        <button
            (click)="toggle()"
            [class]="
                'relative inline-flex h-5 w-9 flex-shrink-0 cursor-pointer items-center rounded-full transition-colors duration-200 ease-in-out focus:outline-none focus:ring-1 focus:ring-primary focus:ring-offset-1 focus:ring-offset-background ' +
                (enabled() ? 'bg-primary' : 'bg-foreground/30')
            "
            type="button"
            role="switch"
            [attr.aria-checked]="enabled()"
            [attr.aria-label]="'Toggle ' + label()"
        >
            <span
                [class]="
                    'inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow-sm transition duration-200 ease-in-out ' +
                    (enabled() ? 'translate-x-[18px]' : 'translate-x-[2px]')
                "
            ></span>
        </button>
    </div>
</div>
