@if (showBanner()) {
    <div
        class="bg-amber-500/10 border-b border-amber-500/20 px-4 py-1.5 flex items-center justify-between animate-in slide-in-from-top duration-300"
    >
        <div class="flex items-center gap-2">
            <lucide-icon [img]="AlertTriangleIcon" class="w-3 h-3 text-amber-700"></lucide-icon>
            <span class="text-[9px] font-bold text-amber-900 uppercase tracking-wider">
                Cloud Connection Lost • Changes saved to browser cache only
            </span>
        </div>
        <p class="text-[8px] text-amber-900 font-mono uppercase">Offline Mode Enabled</p>
    </div>
}
