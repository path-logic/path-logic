<div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-background/40 backdrop-blur-xl transition-all duration-500 ease-in-out"
    [class.opacity-100]="isVisible()"
    [class.pointer-events-auto]="isVisible()"
    [class.opacity-0]="!isVisible()"
    [class.pointer-events-none]="!isVisible()"
>
    <div
        class="max-w-md w-full mx-4 p-8 rounded-3xl border border-border bg-card/80 shadow-2xl backdrop-blur-md text-center transform transition-all duration-500 delay-75 ease-out"
        [class.scale-100]="isVisible()"
        [class.translate-y-0]="isVisible()"
        [class.opacity-100]="isVisible()"
        [class.scale-95]="!isVisible()"
        [class.translate-y-4]="!isVisible()"
        [class.opacity-0]="!isVisible()"
    >
        <div
            class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-6 ring-1 ring-primary/20"
        >
            <lucide-icon [img]="LockIcon" class="w-8 h-8 text-primary shadow-sm"></lucide-icon>
        </div>

        <h2 class="text-2xl font-bold tracking-tight mb-2">Session Paused</h2>
        <p class="text-muted-foreground text-sm mb-8 px-4 leading-relaxed">
            Your session has been paused due to inactivity to protect your financial data.
        </p>

        <div class="space-y-3">
            <button
                (click)="unlocked.emit()"
                class="w-full h-12 rounded-xl text-md font-semibold group flex items-center justify-center gap-2 transition-transform active:scale-[0.98] bg-primary text-primary-foreground hover:bg-primary/90"
            >
                Resume Session
                <lucide-icon
                    [img]="ArrowRightIcon"
                    class="w-4 h-4 transition-transform group-hover:translate-x-1"
                ></lucide-icon>
            </button>

            <div
                class="pt-2 flex items-center justify-center gap-2 text-[10px] text-muted-foreground uppercase tracking-widest font-medium"
            >
                <lucide-icon [img]="ShieldAlertIcon" class="w-3 h-3"></lucide-icon>
                Secure Local-First Environment
            </div>
        </div>
    </div>
</div>
