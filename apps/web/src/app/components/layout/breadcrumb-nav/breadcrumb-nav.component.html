@if (breadcrumbs().length > 0) {
    <nav
        class="mb-2 flex items-center gap-1.5 text-[10px] uppercase font-bold tracking-wider text-muted-foreground"
    >
        <a routerLink="/" class="hover:text-primary transition-colors flex items-center gap-1">
            <lucide-icon [img]="HomeIcon" class="h-3 w-3"></lucide-icon>
            Home
        </a>
        <span class="text-border">/</span>

        @for (crumb of breadcrumbs(); track crumb.href) {
            @if (crumb.isLast) {
                <span class="text-primary">{{ crumb.label }}</span>
            } @else {
                <a [routerLink]="crumb.href" class="hover:text-primary transition-colors">
                    {{ crumb.label }}
                </a>
                <span class="text-border">/</span>
            }
        }
    </nav>
}
