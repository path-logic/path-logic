name: Deploy to Vercel

on:
    push:
        branches:
            - main
            - develop
    pull_request:

jobs:
    deploy-web:
        name: Deploy Web App
        runs-on: ubuntu-latest
        environment:
            name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        steps:
            - uses: actions/checkout@v4
            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
              env:
                  NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

            - name: Deploy to Vercel
              uses: amondnet/vercel-action@v20
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
                  vercel-args: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '--prod' || '' }}

    deploy-storybook:
        name: Deploy Storybook
        runs-on: ubuntu-latest
        environment:
            name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        steps:
            - uses: actions/checkout@v4
            - name: Install dependencies
              run: npm ci

            - name: Build Storybook
              run: npx nx build-storybook web
              env:
                  STORYBOOK_USERNAME: ${{ secrets.STORYBOOK_USERNAME }}
                  STORYBOOK_PASSWORD: ${{ secrets.STORYBOOK_PASSWORD }}
                  STORYBOOK_TSCONFIG: .storybook/tsconfig.json

            - name: Deploy to Vercel
              uses: amondnet/vercel-action@v20
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_STORYBOOK }}
                  vercel-args: deploy apps/web/dist/storybook --confirm ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '--prod' || '' }}
