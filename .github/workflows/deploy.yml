# Deploy to Firebase Hosting on push to main or develop
name: Deploy to Firebase

on:
    push:
        branches: [main, develop]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
            NX_CLOUD_NO_TIMEOUTS: true
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci --force

            # Build web app with environment-specific configuration
            - name: Build Web App
              run: |
                  if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                    npx nx run web:build:production
                  else
                    npx nx run web:build:staging
                  fi

            # Build Storybook static site
            - run: npx nx run web:build-storybook

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: projects/48071364929/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
                  service_account: firebase-adminsdk-fbsvc@path-logic-staging.iam.gserviceaccount.com

            - name: Install Firebase CLI
              run: npm install -g firebase-tools

            # Deploy Web App
            - name: Deploy Web App
              run: firebase deploy --only hosting:web --project ${{ github.ref == 'refs/heads/main' && 'path-logic' || 'path-logic-staging' }}

            # Deploy Storybook (Production only)
            - name: Deploy Storybook (Production only)
              if: github.ref == 'refs/heads/main'
              run: firebase deploy --only hosting:storybook --project path-logic
