# Deploy to Firebase Hosting on push to main or develop
name: Deploy to Firebase

on:
    push:
        branches: [main, develop]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci --force

            # Build web app with environment-specific configuration
            - name: Build Web App
              run: |
                  if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                    npm run build
                  else
                    npm run build-staging
                  fi

            # Build Storybook static site (both branches)
            - name: Build Storybook
              run: npm run build-storybook

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: projects/48071364929/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
                  service_account: ${{ github.ref == 'refs/heads/main' && 'firebase-adminsdk-fbsvc@path-logic.iam.gserviceaccount.com' || 'firebase-adminsdk-fbsvc@path-logic-staging.iam.gserviceaccount.com' }}

            - name: Install Firebase CLI
              run: npm install -g firebase-tools

            # Deploy Web App
            - name: Deploy Web App
              run: firebase deploy --only hosting:web --project ${{ github.ref == 'refs/heads/main' && 'path-logic' || 'path-logic-staging' }}
              env:
                  GCP_PROJECT: ${{ github.ref == 'refs/heads/main' && 'path-logic' || 'path-logic-staging' }}
                  GOOGLE_CLOUD_PROJECT: ${{ github.ref == 'refs/heads/main' && 'path-logic' || 'path-logic-staging' }}
                  GCLOUD_PROJECT: ${{ github.ref == 'refs/heads/main' && 'path-logic' || 'path-logic-staging' }}

            # Deploy Storybook — staging on develop, production on main
            - name: Deploy Storybook (Staging)
              if: github.ref == 'refs/heads/develop'
              run: firebase deploy --only hosting:storybook-staging --project path-logic-staging
              env:
                  GCP_PROJECT: path-logic-staging
                  GOOGLE_CLOUD_PROJECT: path-logic-staging
                  GCLOUD_PROJECT: path-logic-staging

            - name: Deploy Storybook (Production)
              if: github.ref == 'refs/heads/main'
              run: firebase deploy --only hosting:storybook --project path-logic
              env:
                  GCP_PROJECT: path-logic
                  GOOGLE_CLOUD_PROJECT: path-logic
                  GCLOUD_PROJECT: path-logic
