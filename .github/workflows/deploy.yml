# Deploy to Firebase Hosting on push to main or develop
name: Deploy to Firebase

on:
    push:
        branches: [main, develop]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
            NX_CLOUD_NO_TIMEOUTS: true
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci --force

            # Build web app with environment-specific configuration
            - name: Build Web App
              run: |
                  if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                    npx nx run web:build:production
                  else
                    npx nx run web:build:staging
                  fi

            # Build Storybook static site
            - run: npx nx run web:build-storybook

            # Deploy web app to Firebase Hosting
            - uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: ${{ secrets.GITHUB_TOKEN }}
                  firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  channelId: live
                  projectId: ${{ github.ref == 'refs/heads/main' && 'path-logic' || 'path-logic-staging' }}
                  target: web

            # Deploy Storybook to Firebase Hosting (Production only)
            - name: Deploy Storybook (Production only)
              if: github.ref == 'refs/heads/main'
              uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: ${{ secrets.GITHUB_TOKEN }}
                  firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  channelId: live
                  projectId: path-logic
                  target: storybook
