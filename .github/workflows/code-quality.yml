name: Code Quality

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']
    workflow_dispatch:

jobs:
    code-quality:
        name: Code Quality
        runs-on: ubuntu-latest
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
            # Disable NX Cloud if token is not available
            NX_CLOUD_NO_TIMEOUTS: true
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Required for NX affected commands

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: make install

            - name: Build project
              run: npm run build
              continue-on-error: false

            - name: Run typecheck
              run: make typecheck

            - name: Run all linters
              run: make lint

            - name: Run all tests with coverage
              run: npm run test -- --coverage

            - name: Report Coverage to DeepSource
              if: always()
              uses: deepsourcelabs/test-coverage-action@master
              with:
                  key: javascript
                  coverage-file: coverage/app/clover.xml
                  dsn: ${{ secrets.  }}

            - name: Check formatting
              run: make format-check
